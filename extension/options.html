<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>GFG → GitHub Settings</title>
</head>
<body style="font-family:Arial,sans-serif;max-width:600px;margin:40px auto;padding:20px">
  <h2>GFG → GitHub Settings</h2>
  <p>Enter a GitHub Personal Access Token with permission to write to your repository.</p>
  <label>GitHub Token</label><br>
  <input id="token" type="password" style="width:100%;padding:8px"><br><br>
  <label>Repository</label><br>
  <input id="repo" value="mdimran2211/GFG-Solutions" style="width:100%;padding:8px"><br><br>
  <label>Branch</label><br>
  <input id="branch" value="main" style="width:100%;padding:8px"><br><br>
  <button id="save" style="padding:10px 18px">Save Settings</button>
  <span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
